services:
  postgres:
    image: postgres:16-alpine
    container_name: eduvigia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "7"}

  redis:
    image: redis:7-alpine
    container_name: eduvigia_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "7"}

  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: eduvigia_mediamtx
    restart: unless-stopped
    ports:
      - "18554:8554"
      - "18888:8888"
      - "18889:8889"
      - "18189:18189/udp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${EDUVIGIA_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1,localhost}
    volumes:
      - ./mediamtx/mediamtx.prod.yml:/mediamtx.yml:ro
      - ./nginx/certs:/certs:ro
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "7"}

  api:
    image: eduvigia-api:latest
    build:
      context: ./backend
    container_name: eduvigia_api
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-2.0.0-F8-R1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      EDUVIGIA_MAP_TILE_URL: ${EDUVIGIA_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      EDUVIGIA_MAP_ATTRIBUTION: ${EDUVIGIA_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
      EDUVIGIA_SEED_DEMO_DATA: ${EDUVIGIA_SEED_DEMO_DATA:-false}
      EDUVIGIA_BOOTSTRAP_ADMIN_EMAIL: ${EDUVIGIA_BOOTSTRAP_ADMIN_EMAIL:-admin@eduvigia.local}
      EDUVIGIA_BOOTSTRAP_ADMIN_PASSWORD: ${EDUVIGIA_BOOTSTRAP_ADMIN_PASSWORD}
      EDUVIGIA_CREDENTIAL_KEY: ${EDUVIGIA_CREDENTIAL_KEY}
      EDUVIGIA_EVENT_INGEST_KEY: ${EDUVIGIA_EVENT_INGEST_KEY:-}
      EDUVIGIA_PTZ_LEASE_SECONDS: ${EDUVIGIA_PTZ_LEASE_SECONDS:-30}
      EDUVIGIA_PLAYBACK_EXPORT_MAX_SECONDS: ${EDUVIGIA_PLAYBACK_EXPORT_MAX_SECONDS:-1800}
      EDUVIGIA_PLAYBACK_PREVIEW_MAX_SECONDS: ${EDUVIGIA_PLAYBACK_PREVIEW_MAX_SECONDS:-120}
      EDUVIGIA_PLAYBACK_PREVIEW_TTL_SECONDS: ${EDUVIGIA_PLAYBACK_PREVIEW_TTL_SECONDS:-600}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-suporte@eduvigia.local}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-(81) 0000-0000}
      SUPPORT_HOURS: ${SUPPORT_HOURS:-Segunda a sexta, 08:00 às 18:00}
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEDIAMTX_API: http://mediamtx:9997
      EDUVIGIA_DATA_DIR: /app/data
      EDUVIGIA_STREAM_SIGNING_KEY: ${EDUVIGIA_STREAM_SIGNING_KEY}
      EDUVIGIA_STREAM_TOKEN_TTL_SECONDS: ${EDUVIGIA_STREAM_TOKEN_TTL_SECONDS:-300}
      EDUVIGIA_WEBRTC_PUBLIC_PORT: ${EDUVIGIA_WEBRTC_PUBLIC_PORT:-18889}
      EDUVIGIA_HLS_PUBLIC_PORT: ${EDUVIGIA_HLS_PUBLIC_PORT:-18888}
      EDUVIGIA_WEBRTC_PUBLIC_BASE: ${EDUVIGIA_WEBRTC_PUBLIC_BASE:-}
      EDUVIGIA_HLS_PUBLIC_BASE: ${EDUVIGIA_HLS_PUBLIC_BASE:-}
      EDUVIGIA_MEDIA_PUBLIC_SCHEME: https
      EDUVIGIA_DB_POOL_SIZE: ${EDUVIGIA_DB_POOL_SIZE:-20}
      EDUVIGIA_DB_MAX_OVERFLOW: ${EDUVIGIA_DB_MAX_OVERFLOW:-40}
      EDUVIGIA_DB_POOL_TIMEOUT_SECONDS: ${EDUVIGIA_DB_POOL_TIMEOUT_SECONDS:-30}
      EDUVIGIA_DB_POOL_RECYCLE_SECONDS: ${EDUVIGIA_DB_POOL_RECYCLE_SECONDS:-1800}
      EDUVIGIA_STORAGE_WARNING_PERCENT: ${EDUVIGIA_STORAGE_WARNING_PERCENT:-80}
      EDUVIGIA_STORAGE_CRITICAL_PERCENT: ${EDUVIGIA_STORAGE_CRITICAL_PERCENT:-95}
      EDUVIGIA_BACKUP_RETENTION_DAYS: ${EDUVIGIA_BACKUP_RETENTION_DAYS:-30}
      EDUVIGIA_AUDIT_RETENTION_DAYS: ${EDUVIGIA_AUDIT_RETENTION_DAYS:-365}
      EDUVIGIA_TLS_HOSTS: ${EDUVIGIA_TLS_HOSTS:-localhost,127.0.0.1}
      EDUVIGIA_TLS_CERT_DIR: /certs
    volumes:
      - ./data:/app/data
      - ./nginx/certs:/certs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mediamtx: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    networks: [backend, frontend]
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "10"}

  web:
    build:
      context: ./frontend
    container_name: eduvigia_web
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "7"}

  proxy:
    image: nginx:1.27-alpine
    container_name: eduvigia_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [frontend]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eduvigia_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api: {condition: service_healthy}
      mediamtx: {condition: service_started}
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "7"}

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
