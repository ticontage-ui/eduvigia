events {
    worker_connections 2048;
}

http {
    server_tokens off;
    client_max_body_size 100m;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # R3.2-R5.1: resolve Chat targets dynamically through Docker DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream eduvigia_api {
        server api:8000;
        keepalive 32;
    }

    upstream eduvigia_web {
        server web:5173;
        keepalive 16;
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Chat targets are resolved only when a Chat route is requested.
        set $eduvigia_chat_api http://eduvigia-chat-api:8000;
        set $eduvigia_chat_livekit http://eduvigia-chat-livekit:17880;
        set $eduvigia_chat_web https://eduvigia-chat-web:443;

        ssl_certificate /etc/nginx/certs/eduvigia.crt;
        ssl_certificate_key /etc/nginx/certs/eduvigia.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: http: https:; frame-ancestors 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location = /api/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://eduvigia_api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # R3.2-R5.2 — Chat UI on the principal EduVigIA origin.
        location = /chat {
            return 308 /chat/;
        }

        location /chat/ {
            rewrite ^/chat/(.*)$ /$1 break;
            proxy_pass $eduvigia_chat_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
        }

        # R3.2-R5.1 — Chat REST on the main EduVigIA origin.
        # /api/chat/foo -> Chat /api/foo
        location /api/chat/ {
            limit_req zone=api_general burst=40 nodelay;
            rewrite ^/api/chat/(.*)$ /api/$1 break;
            proxy_pass $eduvigia_chat_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
        }

        # Main Chat WebSocket.
        location = /ws/chat {
            rewrite ^ /ws break;
            proxy_pass $eduvigia_chat_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # PTT and other Chat websocket paths.
        # /ws/chat/foo -> Chat /ws/foo
        location /ws/chat/ {
            rewrite ^/ws/chat/(.*)$ /ws/$1 break;
            proxy_pass $eduvigia_chat_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Authenticated attachment/media alias.
        location /media/chat/ {
            rewrite ^/media/chat/(.*)$ /api/emergency/attachments/$1 break;
            proxy_pass $eduvigia_chat_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
            add_header Cache-Control "private, no-store" always;
        }

        # LiveKit signaling same-origin base.
        location = /rtc/chat {
            rewrite ^ /rtc break;
            proxy_pass $eduvigia_chat_livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /rtc/chat/ {
            rewrite ^/rtc/chat/(.*)$ /$1 break;
            proxy_pass $eduvigia_chat_livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://eduvigia_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://eduvigia_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
