events {
    worker_connections 2048;
}

http {
    server_tokens off;
    client_max_body_size 100m;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream eduvigia_api {
        server api:8000;
        keepalive 32;
    }

    upstream eduvigia_web {
        server web:5173;
        keepalive 16;
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/eduvigia.crt;
        ssl_certificate_key /etc/nginx/certs/eduvigia.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http: https: ws: wss:; media-src 'self' blob: http: https:; frame-ancestors 'self'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location = /api/auth/login {
            limit_req zone=auth_login burst=5 nodelay;
            proxy_pass http://eduvigia_api/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://eduvigia_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://eduvigia_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
