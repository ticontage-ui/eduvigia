<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EduVigIA Chat â€” V0.2</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <main class="app">
        <aside class="sidebar">
            <div class="brand">
                <div>
                    <strong>EduVigIA Chat</strong>
                    <small>Standalone 0.2.0-R1</small>
                </div>
                <span id="status" class="status">offline</span>
            </div>

            <label class="identity-picker">
                Identidade de teste
                <select id="identity"></select>
            </label>

            <button id="newConversation" class="new-button" type="button">
                + Nova conversa
            </button>

            <div id="conversations" class="conversations"></div>
        </aside>

        <section class="chat">
            <header class="chat-header">
                <div>
                    <h1 id="conversationTitle">Selecione uma conversa</h1>
                    <p id="conversationMeta">Identity Provider: mock Â· Core: desconectado</p>
                </div>
            </header>

            <section id="messages" class="messages"></section>

            <form id="composer" class="composer">
                <input id="body" maxlength="2000" autocomplete="off"
                       placeholder="Digite uma mensagem..." disabled />
                <button id="send" type="submit" disabled>Enviar</button>
            </form>
        </section>
    </main>

    <dialog id="conversationDialog">
        <form id="conversationForm" method="dialog" class="dialog-form">
            <h2>Nova conversa</h2>

            <label>
                Tipo
                <select id="conversationType">
                    <option value="DIRECT">Direta</option>
                    <option value="GROUP">Grupo</option>
                    <option value="INSTITUTIONAL">Institucional</option>
                </select>
            </label>

            <label>
                TÃ­tulo
                <input id="conversationName" maxlength="160"
                       placeholder="ObrigatÃ³rio para grupo/institucional" />
            </label>

            <fieldset>
                <legend>Membros</legend>
                <div id="memberChoices" class="member-choices"></div>
            </fieldset>

            <div class="dialog-actions">
                <button id="cancelDialog" type="button">Cancelar</button>
                <button type="submit">Criar</button>
            </div>
        </form>
    </dialog>

    <script src="/app.js"></script>
</body>
</html>
