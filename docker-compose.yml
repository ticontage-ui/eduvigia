services:
  postgres:
    image: postgres:16-alpine
    container_name: eduvigia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: eduvigia_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mediamtx:
    image: bluenviron/mediamtx:1.19.1
    container_name: eduvigia_mediamtx
    restart: unless-stopped
    ports:
      - "18554:8554"
      - "18888:8888"
      - "18889:8889"
      - "18189:18189/udp"
      - "127.0.0.1:19997:9997"
      - "127.0.0.1:19998:9998"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${EDUVIGIA_WEBRTC_ADDITIONAL_HOSTS:-127.0.0.1,localhost}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    image: eduvigia-api:latest
    build:
      context: ./backend
    container_name: eduvigia_api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-2.0.0-F7-R3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5177,http://127.0.0.1:5177,http://localhost:8088,https://localhost:18443}
      EDUVIGIA_MAP_TILE_URL: ${EDUVIGIA_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      EDUVIGIA_MAP_ATTRIBUTION: ${EDUVIGIA_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
      EDUVIGIA_SEED_DEMO_DATA: ${EDUVIGIA_SEED_DEMO_DATA:-false}
      EDUVIGIA_BOOTSTRAP_ADMIN_EMAIL: ${EDUVIGIA_BOOTSTRAP_ADMIN_EMAIL:-admin@eduvigia.local}
      EDUVIGIA_BOOTSTRAP_ADMIN_PASSWORD: ${EDUVIGIA_BOOTSTRAP_ADMIN_PASSWORD}
      EDUVIGIA_CREDENTIAL_KEY: ${EDUVIGIA_CREDENTIAL_KEY}
      EDUVIGIA_EVENT_INGEST_KEY: ${EDUVIGIA_EVENT_INGEST_KEY:-}
      EDUVIGIA_PTZ_LEASE_SECONDS: ${EDUVIGIA_PTZ_LEASE_SECONDS:-30}
      EDUVIGIA_PLAYBACK_EXPORT_MAX_SECONDS: ${EDUVIGIA_PLAYBACK_EXPORT_MAX_SECONDS:-1800}
      EDUVIGIA_PLAYBACK_PREVIEW_MAX_SECONDS: ${EDUVIGIA_PLAYBACK_PREVIEW_MAX_SECONDS:-120}
      EDUVIGIA_PLAYBACK_PREVIEW_TTL_SECONDS: ${EDUVIGIA_PLAYBACK_PREVIEW_TTL_SECONDS:-600}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-suporte@eduvigia.local}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-(81) 0000-0000}
      SUPPORT_HOURS: ${SUPPORT_HOURS:-Segunda a sexta, 08:00 às 18:00}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MEDIAMTX_API: http://mediamtx:9997
      EDUVIGIA_DATA_DIR: /app/data
      EDUVIGIA_STREAM_SIGNING_KEY: ${EDUVIGIA_STREAM_SIGNING_KEY}
      EDUVIGIA_STREAM_TOKEN_TTL_SECONDS: ${EDUVIGIA_STREAM_TOKEN_TTL_SECONDS:-300}
      EDUVIGIA_WEBRTC_PUBLIC_PORT: ${EDUVIGIA_WEBRTC_PUBLIC_PORT:-18889}
      EDUVIGIA_HLS_PUBLIC_PORT: ${EDUVIGIA_HLS_PUBLIC_PORT:-18888}
      EDUVIGIA_WEBRTC_PUBLIC_BASE: ${EDUVIGIA_WEBRTC_PUBLIC_BASE:-}
      EDUVIGIA_HLS_PUBLIC_BASE: ${EDUVIGIA_HLS_PUBLIC_BASE:-}
      EDUVIGIA_MEDIA_PUBLIC_SCHEME: ${EDUVIGIA_MEDIA_PUBLIC_SCHEME:-http}
      EDUVIGIA_DB_POOL_SIZE: ${EDUVIGIA_DB_POOL_SIZE:-10}
      EDUVIGIA_DB_MAX_OVERFLOW: ${EDUVIGIA_DB_MAX_OVERFLOW:-20}
      EDUVIGIA_DB_POOL_TIMEOUT_SECONDS: ${EDUVIGIA_DB_POOL_TIMEOUT_SECONDS:-30}
      EDUVIGIA_DB_POOL_RECYCLE_SECONDS: ${EDUVIGIA_DB_POOL_RECYCLE_SECONDS:-1800}
      EDUVIGIA_STORAGE_WARNING_PERCENT: ${EDUVIGIA_STORAGE_WARNING_PERCENT:-80}
      EDUVIGIA_STORAGE_CRITICAL_PERCENT: ${EDUVIGIA_STORAGE_CRITICAL_PERCENT:-95}
      EDUVIGIA_BACKUP_RETENTION_DAYS: ${EDUVIGIA_BACKUP_RETENTION_DAYS:-30}
      EDUVIGIA_AUDIT_RETENTION_DAYS: ${EDUVIGIA_AUDIT_RETENTION_DAYS:-365}
      EDUVIGIA_TLS_HOSTS: ${EDUVIGIA_TLS_HOSTS:-localhost,127.0.0.1}
      EDUVIGIA_TLS_CERT_DIR: /certs
    ports:
      - "8002:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./nginx/certs:/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 24
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "7"

  web:
    build:
      context: ./frontend
    container_name: eduvigia_web
    restart: unless-stopped
    ports:
      - "5177:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: nginx:1.27-alpine
    container_name: eduvigia_proxy
    restart: unless-stopped
    ports:
      - "8088:80"
      - "18443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: eduvigia_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      mediamtx:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  video_teste:
    image: jrottenberg/ffmpeg:7.1-alpine
    container_name: eduvigia_video_teste
    restart: unless-stopped
    depends_on:
      - mediamtx
    command:
      - -re
      - -f
      - lavfi
      - -i
      - testsrc2=size=1280x720:rate=15
      - -f
      - lavfi
      - -i
      - sine=frequency=880:sample_rate=44100
      - -c:v
      - libx264
      - -preset
      - ultrafast
      - -tune
      - zerolatency
      - -pix_fmt
      - yuv420p
      - -g
      - "30"
      - -b:v
      - 1400k
      - -c:a
      - aac
      - -b:a
      - 96k
      - -f
      - rtsp
      - -rtsp_transport
      - tcp
      - rtsp://mediamtx:8554/teste
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
